<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPI Payment</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
}

.box {
    width: 92%;
    max-width: 400px;
    background: white;
    padding: 35px 25px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}

h1 {
    margin: 0 0 15px;
    font-size: 30px;
}

p {
    color: #666;
    font-size: 17px;
}

.pay {
    width: 100%;
    padding: 18px;
    margin-top: 25px;
    border: 0;
    border-radius: 12px;
    background: #087f3e;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

.upi {
    margin-top: 25px;
    color: #666;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="box" id="fallback">

    <h1>UPI Payment</h1>

    <p>Tap below to choose your UPI app</p>

    <button class="pay" onclick="openUPI()">
        💳 Pay with UPI
    </button>

    <div class="upi">
        UPI ID: 9629502088@ybl
    </div>

</div>

<script>

const upiURL =
    "upi://pay" +
    "?pa=9629502088%40ybl" +
    "&pn=Antony%20Jaffer" +
    "&cu=INR";

/*
    FIRST ATTEMPT:
    Immediately launch the UPI intent.
*/

let redirected = false;

function launchUPI() {
    redirected = true;

    // Try Android UPI intent
    window.location.href = upiURL;

    // If browser does not leave the page,
    // keep the fallback interface visible.
    setTimeout(function() {
        document.getElementById("fallback").style.display = "block";
    }, 1500);
}

/*
    FALLBACK BUTTON
*/

function openUPI() {
    window.location.href = upiURL;
}

/*
    Start automatic redirect.
*/

window.addEventListener("load", function() {

    // Give the page a moment to load
    setTimeout(function() {
        launchUPI();
    }, 300);

});

</script>

</body>
</html>

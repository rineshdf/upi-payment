<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Allen Selvaraj</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .payee-title { font-size: 14px; color: #6b7280; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .payee-name { font-size: 20px; font-weight: 700; color: #111827; margin: 6px 0 2px; }
    .payee-vpa { font-size: 13px; color: #4b5563; background: #f3f4f6; display: inline-block; padding: 4px 10px; border-radius: 20px; margin-bottom: 22px; }
    
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      transition: opacity 0.15s ease;
    }
    .btn:active { opacity: 0.85; }

    .btn-upi { background-color: #2563eb; color: #ffffff; }
    .btn-gpay { background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; }
    .btn-phonepe { background-color: #5f259f; color: #ffffff; }
    .btn-paytm { background-color: #00b9f5; color: #ffffff; }

    .note { margin-top: 18px; font-size: 12px; color: #9ca3af; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="card">
    <div class="payee-title">Paying To</div>
    <div class="payee-name">Allen Selvaraj</div>
    <div class="payee-vpa">allenselvaraj@sbi</div>

    <div class="btn-group">
      <!-- Universal Intent -->
      <a class="btn btn-upi" href="upi://pay?pa=allenselvaraj@sbi&pn=Allen%20Selvaraj&cu=INR">
        ⚡ Open Default UPI App
      </a>

      <!-- Direct GPay Intent -->
      <a class="btn btn-gpay" href="gpay://upi/pay?pa=allenselvaraj@sbi&pn=Allen%20Selvaraj&cu=INR">
        Google Pay
      </a>

      <!-- Direct PhonePe Intent -->
      <a class="btn btn-phonepe" href="phonepe://pay?pa=allenselvaraj@sbi&pn=Allen%20Selvaraj&cu=INR">
        PhonePe
      </a>

      <!-- Direct Paytm Intent -->
      <a class="btn btn-paytm" href="paytmmp://pay?pa=allenselvaraj@sbi&pn=Allen%20Selvaraj&cu=INR">
        Paytm
      </a>
    </div>

    <p class="note">Tap your preferred app if your phone did not launch automatically.</p>
  </div>

  <script>
    // Immediate execution without waiting for page assets/images to load
    (function() {
      const upiUrl = "upi://pay?pa=allenselvaraj@sbi&pn=Allen%20Selvaraj&cu=INR";
      try {
        window.location.replace(upiUrl);
      } catch (e) {
        window.location.href = upiUrl;
      }
    })();
  </script>

</body>
</html>

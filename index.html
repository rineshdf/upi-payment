<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Payment Details</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100vh; overflow: hidden; background: #f1f5f9; display: flex; justify-content: center; align-items: center; }
    
    .card {
      background: #ffffff;
      width: 92%;
      max-width: 360px;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header h2 { font-size: 17px; font-weight: 800; color: #0f172a; }
    .header p { font-size: 11px; color: #64748b; margin-top: 1px; }

    /* Compact QR & Phone Side-by-Side */
    .top-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      align-items: center;
      background: #f8fafc;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    .qr-box img {
      width: 110px;
      height: 110px;
      display: block;
      border-radius: 8px;
      background: #fff;
    }

    .pay-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .phone-tag { font-size: 10px; font-weight: 700; color: #0284c7; text-transform: uppercase; }
    .phone-val { font-size: 15px; font-weight: 900; color: #0f172a; }

    /* Compact Buttons */
    .btn {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s ease;
      width: 100%;
    }
    .btn-copy { background: #0284c7; color: #fff; }
    .btn-copy:active { background: #0369a1; }
    .btn-dl { background: #ffffff; color: #334155; border: 1px solid #cbd5e1; }
    .btn-dl:active { background: #e2e8f0; }

    /* Clean Bank Summary Table */
    .bank-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px 12px;
      text-align: left;
    }
    .bank-title {
      font-size: 10.5px;
      font-weight: 800;
      color: #0284c7;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      font-size: 11.5px;
      border-bottom: 1px dashed #e2e8f0;
    }
    .row:last-child { border-bottom: none; }
    .lbl { color: #64748b; font-weight: 600; font-size: 10.5px; }
    .val { color: #0f172a; font-weight: 800; }
    
    .chip {
      background: #e2e8f0;
      color: #334155;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      margin-left: 4px;
    }
    .chip:active { background: #cbd5e1; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header -->
    <div class="header">
      <h2>Payment Options</h2>
      <p>Scan QR, pay by Phone Number, or Bank Transfer</p>
    </div>

    <!-- Top Section: QR Code + Quick Phone Pay -->
    <div class="top-grid">
      <div class="qr-box">
        <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi%3A%2F%2Fpay%3Fpa%3Dallenselvaraj%40sbi%26pn%3DALLEN%2520S%2520D%2520PAUL%2520SELVARAJ" alt="Payment QR">
      </div>

      <div class="pay-actions">
        <div>
          <div class="phone-tag">GPay / PhonePe No</div>
          <div class="phone-val">8838903573</div>
        </div>

        <button class="btn btn-copy" id="phoneBtn" onclick="copyText('8838903573', 'phoneBtn', '📋 Copy Phone No')">
          📋 Copy Phone No
        </button>

        <button class="btn btn-dl" id="dlBtn" onclick="downloadQR()">
          📥 Save QR Code
        </button>
      </div>
    </div>

    <!-- Bank Details Section -->
    <div class="bank-box">
      <div class="bank-title">STATE BANK OF INDIA</div>

      <div class="row">
        <span class="lbl">NAME</span>
        <span class="val">ALLEN S D PAUL SELVARAJ</span>
      </div>

      <div class="row">
        <span class="lbl">A/C NO</span>
        <span class="val">
          45147364819
          <button class="chip" onclick="copyText('45147364819', null)">Copy</button>
        </span>
      </div>

      <div class="row">
        <span class="lbl">IFSC</span>
        <span class="val">SBIN0064310</span>
      </div>

      <div class="row">
        <span class="lbl">UPI ID</span>
        <span class="val">
          allenselvaraj@sbi
          <button class="chip" onclick="copyText('allenselvaraj@sbi', null)">Copy</button>
        </span>
      </div>
    </div>
  </div>

  <script>
    function copyText(val, btnId, originalText) {
      navigator.clipboard.writeText(val).then(() => {
        if (btnId) {
          const btn = document.getElementById(btnId);
          btn.innerText = "✓ Copied!";
          btn.style.backgroundColor = "#16a34a";
          setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "#0284c7";
          }, 2000);
        } else {
          alert("Copied: " + val);
        }
      });
    }

    async function downloadQR() {
      const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=upi%3A%2F%2Fpay%3Fpa%3Dallenselvaraj%40sbi%26pn%3DALLEN%2520S%2520D%2520PAUL%2520SELVARAJ";
      const btn = document.getElementById("dlBtn");
      btn.innerText = "⏳ Saving...";
      try {
        const response = await fetch(qrUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = "Payment_QR.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
        btn.innerText = "✓ Saved!";
        setTimeout(() => { btn.innerText = "📥 Save QR Code"; }, 2000);
      } catch (err) {
        window.open(qrUrl, "_blank");
        btn.innerText = "📥 Save QR Code";
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 360px; padding: 28px 24px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
    h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 18px; }
    
    .qr-container {
      background: #ffffff;
      padding: 14px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      display: inline-block;
      margin-bottom: 14px;
    }
    .qr-container img { width: 200px; height: 200px; display: block; }

    .vpa-pill {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      word-break: break-all;
    }

    .btn-group { display: flex; flex-direction: column; gap: 10px; }

    .btn {
      width: 100%;
      padding: 13px 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    
    /* Primary Action: Copy */
    .btn-copy { background-color: #0284c7; color: #ffffff; }
    .btn-copy:active { background-color: #0369a1; }

    /* Secondary Action: Save QR */
    .btn-download { background-color: #f1f5f9; color: #1e293b; border: 1.5px solid #cbd5e1; }
    .btn-download:active { background-color: #e2e8f0; }

    .guide-box {
      margin-top: 18px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 12px;
      text-align: left;
      font-size: 12px;
      color: #1e40af;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Scan or Pay via UPI</h2>

    <!-- Standard UPI QR Code -->
    <div class="qr-container">
      <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi%3A%2F%2Fpay%3Fpa%3Dallenselvaraj%40sbi%26pn%3DAllen%2520Selvaraj" alt="UPI QR Code">
    </div>

    <!-- UPI VPA Display -->
    <div class="vpa-pill">allenselvaraj@sbi</div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <!-- Copy Button -->
      <button class="btn btn-copy" id="copyBtn" onclick="copyUPI()">
        📋 Copy UPI ID
      </button>

      <!-- Download QR Button -->
      <button class="btn btn-download" id="dlBtn" onclick="downloadQR()">
        📥 Download QR Image
      </button>
    </div>

    <!-- Instruction Helper -->
    <div class="guide-box">
      💡 <b>Tip:</b> If paying on this phone, tap <b>Download QR</b>, open your UPI app (GPay / PhonePe / Paytm), and tap <b>Scan from Gallery</b>.
    </div>
  </div>

  <script>
    const upiId = "allenselvaraj@sbi";
    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=upi%3A%2F%2Fpay%3Fpa%3Dallenselvaraj%40sbi%26pn%3DAllen%2520Selvaraj";

    // 1. Copy Function
    function copyUPI() {
      navigator.clipboard.writeText(upiId).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.innerText = "✓ Copied! Open UPI App";
        btn.style.backgroundColor = "#16a34a";
        setTimeout(() => {
          btn.innerText = "📋 Copy UPI ID";
          btn.style.backgroundColor = "#0284c7";
        }, 3000);
      });
    }

    // 2. Download QR Image directly to user's gallery/downloads
    async function downloadQR() {
      const btn = document.getElementById("dlBtn");
      btn.innerText = "⏳ Downloading...";
      try {
        const response = await fetch(qrUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = "UPI_Payment_QR.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
        btn.innerText = "✓ Saved to Photos!";
        setTimeout(() => {
          btn.innerText = "📥 Download QR Image";
        }, 3000);
      } catch (err) {
        // Fallback for strict browser cross-origin policies
        window.open(qrUrl, "_blank");
        btn.innerText = "📥 Download QR Image";
      }
    }
  </script>

</body>
</html>

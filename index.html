<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Details</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px 16px; }
    
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 26px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.07);
      text-align: center;
    }
    
    h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 14px; }

    /* QR Section */
    .qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      display: inline-block;
      margin-bottom: 12px;
    }
    .qr-container img { width: 180px; height: 180px; display: block; }

    /* UPI ID Display */
    .vpa-pill {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 800;
      color: #0284c7;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    /* Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }

    .btn {
      width: 100%;
      padding: 12px 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    
    .btn-phone { background-color: #0284c7; color: #ffffff; }
    .btn-phone:active { background-color: #0369a1; }

    .btn-download { background-color: #f8fafc; color: #1e293b; border: 1.5px solid #cbd5e1; }
    .btn-download:active { background-color: #e2e8f0; }

    /* Bank Account Details Box */
    .bank-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      text-align: left;
    }

    .bank-header {
      font-size: 12px;
      font-weight: 800;
      color: #0284c7;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 13px;
    }

    .info-row:last-child { border-bottom: none; }
    .label { color: #64748b; font-weight: 600; font-size: 12px; }
    .value { color: #0f172a; font-weight: 800; text-align: right; }

    .copy-chip {
      background: #e2e8f0;
      color: #334155;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 6px;
      border: none;
    }
    .copy-chip:active { background: #cbd5e1; }

    .guide-box {
      margin-top: 14px;
      padding: 10px 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      text-align: left;
      font-size: 11.5px;
      color: #166534;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Scan or Pay via UPI</h2>

    <!-- Standard UPI QR Code -->
    <div class="qr-container">
      <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=upi%3A%2F%2Fpay%3Fpa%3Dallenselvaraj%40sbi%26pn%3DALLEN%2520S%2520D%2520PAUL%2520SELVARAJ" alt="Payment QR Code">
    </div>

    <!-- Visible UPI ID -->
    <div class="vpa-pill">UPI ID: allenselvaraj@sbi</div>

    <!-- Interactive Quick Buttons -->
    <div class="btn-group">
      <!-- 1. Copy Phone Number -->
      <button class="btn btn-phone" id="phoneBtn" onclick="copyText('8838903573', 'phoneBtn', '📱 Phone No: 8838903573')">
        📱 Copy Phone: 8838903573
      </button>

      <!-- 2. Download QR Image -->
      <button class="btn btn-download" id="dlBtn" onclick="downloadQR()">
        📥 Download QR Image
      </button>
    </div>

    <!-- Detailed Bank Account Container -->
    <div class="bank-card">
      <div class="bank-header">
        🏛️ STATE BANK OF INDIA
      </div>

      <div class="info-row">
        <span class="label">NAME</span>
        <span class="value">ALLEN S D PAUL SELVARAJ</span>
      </div>

      <div class="info-row">
        <span class="label">ACCOUNT NO</span>
        <span class="value">
          45147364819
          <button class="copy-chip" onclick="copyText('45147364819', null)">Copy</button>
        </span>
      </div>

      <div class="info-row">
        <span class="label">IFSC CODE</span>
        <span class="value">SBIN0064310</span>
      </div>

      <div class="info-row">
        <span class="label">PHONE NO</span>
        <span class="value">8838903573</span>
      </div>

      <div class="info-row">
        <span class="label">UPI ID</span>
        <span class="value">allenselvaraj@sbi</span>
      </div>
    </div>

    <div class="guide-box">
      💡 <b>Tip:</b> Tap <b>Copy Phone</b> to pay via GPay/PhonePe number search, or <b>Download QR</b> to scan from your photo gallery.
    </div>
  </div>

  <script>
    // Universal Copy Function with feedback
    function copyText(val, btnId, originalText) {
      navigator.clipboard.writeText(val).then(() => {
        if (btnId) {
          const btn = document.getElementById(btnId);
          btn.innerText = "✓ Copied to Clipboard!";
          btn.style.backgroundColor = "#16a34a";
          setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "#0284c7";
          }, 2500);
        } else {
          alert("Copied: " + val);
        }
      });
    }

    // Direct Image Downloader
    async function downloadQR() {
      const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=upi%3A%2F%2Fpay%3Fpa%3Dallenselvaraj%40sbi%26pn%3DALLEN%2520S%2520D%2520PAUL%2520SELVARAJ";
      const btn = document.getElementById("dlBtn");
      btn.innerText = "⏳ Downloading...";
      try {
        const response = await fetch(qrUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = "Retreat_Payment_QR.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
        btn.innerText = "✓ Saved to Photos!";
        setTimeout(() => {
          btn.innerText = "📥 Download QR Image";
        }, 2500);
      } catch (err) {
        window.open(qrUrl, "_blank");
        btn.innerText = "📥 Download QR Image";
      }
    }
  </script>

</body>
</html>

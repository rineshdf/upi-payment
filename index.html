<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPI Payment</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.card {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 35px 25px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
}

h1 {
    font-size: 30px;
}

.subtitle {
    color: #666;
    font-size: 17px;
}

.pay {
    display: block;
    width: 100%;
    padding: 18px 0;
    margin-top: 28px;
    border: none;
    border-radius: 12px;
    background: #087f3e;
    color: white;
    font-size: 19px;
    font-weight: bold;
    text-decoration: none;
}

.upi {
    margin-top: 25px;
    color: #666;
    font-size: 15px;
}

/* Hide fallback initially */
#fallback {
    display: none;
}
</style>
</head>

<body>

<div class="card" id="fallback">

    <h1>UPI Payment</h1>

    <div class="subtitle">
        Tap below to choose your UPI app
    </div>

    <a class="pay"
       href="upi://pay?pa=9629502088%40ybl&pn=Antony%20Jaffer&cu=INR">
        💳 Pay with UPI
    </a>

    <div class="upi">
        UPI ID: 9629502088@ybl
    </div>

</div>

<script>

const upi =
"upi://pay?pa=9629502088%40ybl&pn=Antony%20Jaffer&cu=INR";

/* Try automatic launch */
window.location.href = upi;

/* If we're still here, show fallback */
setTimeout(function () {
    document.getElementById("fallback").style.display = "block";
}, 1500);

</script>

</body>
</html>
